<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Omnichannel pipeline — as built (Sesi 12–13)</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>

  <!-- Row 1: raw sources -->
  <rect x="40" y="80" width="200" height="70" rx="8" fill="#eef4ff" stroke="#4a6fa5"/>
  <text x="140" y="108" text-anchor="middle" font-size="14" font-weight="bold">raw_pos.csv</text>
  <text x="140" y="128" text-anchor="middle" font-size="12">sales rows, store only</text>

  <rect x="40" y="200" width="200" height="70" rx="8" fill="#eef4ff" stroke="#4a6fa5"/>
  <text x="140" y="228" text-anchor="middle" font-size="14" font-weight="bold">raw_app_events.csv</text>
  <text x="140" y="248" text-anchor="middle" font-size="12">orders + customer phone</text>

  <rect x="40" y="400" width="200" height="70" rx="8" fill="#eef4ff" stroke="#4a6fa5"/>
  <text x="140" y="428" text-anchor="middle" font-size="14" font-weight="bold">target_sheet.xlsx</text>
  <text x="140" y="448" text-anchor="middle" font-size="12">monthly target per channel</text>

  <!-- Row 2: staging -->
  <rect x="360" y="140" width="200" height="70" rx="8" fill="#f3eefc" stroke="#7b5ea7"/>
  <text x="460" y="168" text-anchor="middle" font-size="14" font-weight="bold">stg_transactions</text>
  <text x="460" y="188" text-anchor="middle" font-size="12">cleaned, typed, deduped</text>

  <!-- Row 3: marts -->
  <rect x="700" y="60" width="200" height="60" rx="8" fill="#e9f7ef" stroke="#2e8b57"/>
  <text x="800" y="85" text-anchor="middle" font-size="14" font-weight="bold">dim_customers</text>
  <text x="800" y="103" text-anchor="middle" font-size="12">id, name, phone</text>

  <rect x="700" y="150" width="200" height="60" rx="8" fill="#e9f7ef" stroke="#2e8b57"/>
  <text x="800" y="175" text-anchor="middle" font-size="14" font-weight="bold">dim_target</text>
  <text x="800" y="193" text-anchor="middle" font-size="12">month, channel, wilayah</text>

  <rect x="700" y="240" width="200" height="60" rx="8" fill="#e9f7ef" stroke="#2e8b57"/>
  <text x="800" y="265" text-anchor="middle" font-size="14" font-weight="bold">fact_transactions</text>
  <text x="800" y="283" text-anchor="middle" font-size="12">order rows, revenue, phone*</text>

  <rect x="700" y="330" width="200" height="60" rx="8" fill="#e9f7ef" stroke="#2e8b57"/>
  <text x="800" y="355" text-anchor="middle" font-size="14" font-weight="bold">fact_target</text>
  <text x="800" y="373" text-anchor="middle" font-size="12">month × channel × wilayah</text>

  <!-- Row 4: view + dashboard -->
  <rect x="360" y="460" width="200" height="76" rx="8" fill="#fdf3e3" stroke="#c9862b"/>
  <text x="460" y="486" text-anchor="middle" font-size="14" font-weight="bold">v_kpi_monthly</text>
  <text x="460" y="504" text-anchor="middle" font-size="11">attainment = avg(per-row ratio)</text>
  <text x="460" y="521" text-anchor="middle" font-size="11">8 columns, feeds Sesi 14 tiles</text>

  <rect x="700" y="470" width="200" height="60" rx="8" fill="#fbeaea" stroke="#b33a3a"/>
  <text x="800" y="495" text-anchor="middle" font-size="14" font-weight="bold">Metabase dashboard</text>
  <text x="800" y="513" text-anchor="middle" font-size="12">target vs actual tiles</text>

  <!-- arrows: sources -> staging -->
  <path d="M240,115 C300,115 310,160 360,170" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M240,235 C300,235 310,190 360,180" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- staging -> marts -->
  <path d="M560,160 C620,145 640,100 700,90" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M560,185 C620,205 640,260 700,266" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- target sheet -> dim_target -->
  <path d="M240,435 C400,435 560,180 700,180" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- dim_target -> fact_target -->
  <path d="M800,210 L800,330" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- marts -> view -->
  <path d="M700,285 C620,300 540,400 480,460" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M700,370 C620,390 540,430 490,460" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- view -> dashboard -->
  <path d="M560,498 L700,500" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- footnotes -->
  <text x="40" y="575" font-size="12" fill="#555">* phone: the raw customer phone number is copied into fact_transactions without any change.</text>
  <text x="40" y="593" font-size="12" fill="#555">target_sheet.xlsx: Jan–Feb rows for APP are empty in the source file.</text>
</svg>
